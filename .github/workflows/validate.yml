name: Dataset Invariant Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Comprehensive Offline Politics Validation
        run: |
          python scripts/validate_politics_dataset.py Dataset_\ BanglaBBQ_Old/Politics/banglabbq_politics_english.jsonl Dataset_\ BanglaBBQ_Old/Politics/banglabbq_politics_bengali.jsonl

      - name: Run Canonical Directory Validation
        run: |
          python scripts/validate_politics_dataset.py BanglaBBQ_Politics/banglabbq_politics_english.jsonl BanglaBBQ_Politics/banglabbq_politics_bengali.jsonl

      - name: Run Religion Benchmark Validation
        run: |
          python scripts/validate_religion_dataset.py BanglaBBQ_Religion/Religion_eng.jsonl BanglaBBQ_Religion/Religion_bng.jsonl


      - name: Run Age English Reproduction and Bilingual Structural QA
        run: |
          python scripts/apply_age_english_localization_20261018.py

      - name: Run Gender Benchmark Validation
        run: |
          python scripts/validate_gender_dataset.py BanglaBBQ_Gender/Gender_identity_eng.jsonl BanglaBBQ_Gender/Gender_identity_bng.jsonl
          python scripts/validate_gender_semantics.py BanglaBBQ_Gender/Gender_identity_eng.jsonl BanglaBBQ_Gender/Gender_identity_bng.jsonl

      - name: Run Educational Background Benchmark Validation
        run: |
          python scripts/validate_education_dataset.py BanglaBBQ_EducationalBackground/banglabbq_education_english.jsonl BanglaBBQ_EducationalBackground/banglabbq_education_bengali.jsonl
          python scripts/validate_education_semantics.py BanglaBBQ_EducationalBackground/banglabbq_education_english.jsonl BanglaBBQ_EducationalBackground/banglabbq_education_bengali.jsonl
          python scripts/test_education_semantic_fixtures.py
