name: Dataset Invariant Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Comprehensive Offline Politics Validation
        run: |
          python scripts/validate_politics_dataset.py Dataset_\ BanglaBBQ_Old/Politics/banglabbq_politics_english.jsonl Dataset_\ BanglaBBQ_Old/Politics/banglabbq_politics_bengali.jsonl

      - name: Run Canonical Directory Validation
        run: |
          python scripts/validate_politics_dataset.py Dataset_BanglaBBQ_New/BanglaBBQ_Politics/BanglaBBQ_ENG_Politics.jsonl Dataset_BanglaBBQ_New/BanglaBBQ_Politics/BanglaBBQ_BEN_Politics.jsonl

      - name: Run Religion Benchmark Validation
        run: |
          python scripts/validate_religion_dataset.py Dataset_BanglaBBQ_New/BanglaBBQ_Religion/BanglaBBQ_ENG_Religion.jsonl Dataset_BanglaBBQ_New/BanglaBBQ_Religion/BanglaBBQ_BEN_Religion.jsonl


      - name: Run Age English Reproduction and Bilingual Structural QA
        run: |
          python scripts/apply_age_english_localization_20261018.py

      - name: Run Gender Benchmark Validation
        run: |
          python scripts/validate_gender_dataset.py Dataset_BanglaBBQ_New/BanglaBBQ_Gender/BanglaBBQ_ENG_Gender.jsonl Dataset_BanglaBBQ_New/BanglaBBQ_Gender/BanglaBBQ_BEN_Gender.jsonl
          python scripts/validate_gender_semantics.py Dataset_BanglaBBQ_New/BanglaBBQ_Gender/BanglaBBQ_ENG_Gender.jsonl Dataset_BanglaBBQ_New/BanglaBBQ_Gender/BanglaBBQ_BEN_Gender.jsonl

      - name: Run Educational Background Benchmark Validation
        run: |
          python scripts/validate_education_dataset.py Dataset_BanglaBBQ_New/BanglaBBQ_EducationalBackground/BanglaBBQ_ENG_Education.jsonl Dataset_BanglaBBQ_New/BanglaBBQ_EducationalBackground/BanglaBBQ_BEN_Education.jsonl
          python scripts/validate_education_semantics.py Dataset_BanglaBBQ_New/BanglaBBQ_EducationalBackground/BanglaBBQ_ENG_Education.jsonl Dataset_BanglaBBQ_New/BanglaBBQ_EducationalBackground/BanglaBBQ_BEN_Education.jsonl
          python scripts/test_education_semantic_fixtures.py

      - name: Run Seven Final Categories Benchmark Invariant Validation
        run: |
          python scripts/validate_seven_final_categories.py

