name: Materialize BanglaBBQ Politics V2/V3 Expansion

on:
  push:
    branches: [main]
    paths:
      - 'BanglaBBQ_Politics/expansion_v2v3_20261017/**'
      - 'scripts/assemble_politics_expansion.py'
      - '.github/workflows/assemble_politics_expansion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: politics-expansion-assembly
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify immutable baseline and rebuild bilingual Politics JSONL
        run: python scripts/assemble_politics_expansion.py

      - name: Validate all expanded Politics invariants
        run: python scripts/validate_politics_dataset.py BanglaBBQ_Politics/banglabbq_politics_english.jsonl BanglaBBQ_Politics/banglabbq_politics_bengali.jsonl

      - name: Commit regenerated canonical snapshots (append-only, no force push)
        shell: bash
        run: |
          if git diff --quiet -- BanglaBBQ_Politics/banglabbq_politics_english.jsonl BanglaBBQ_Politics/banglabbq_politics_bengali.jsonl; then
            echo "Canonical snapshots already match validated expansion."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BanglaBBQ_Politics/banglabbq_politics_english.jsonl BanglaBBQ_Politics/banglabbq_politics_bengali.jsonl
          git commit -m "feat(politics): materialize 2,880 bilingual records from reviewed wording shards"
          git push origin HEAD:main
